<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodus Todo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Custom Windows 11 Titlebar -->
    <header id="app-titlebar" class="window-titlebar">
      <div class="titlebar-drag-region">
        <div class="app-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
          </div>
          <span class="brand-name">Nodus <span class="brand-tag">Desktop</span></span>
        </div>
        <div class="titlebar-center">
          <span id="titlebar-subtitle" class="titlebar-subtitle">All Tasks</span>
        </div>
      </div>

      <!-- Windows Native-style Window Controls -->
      <div class="window-controls">
        <button id="btn-minimize" class="win-btn win-btn-minimize" title="Minimize">
          <svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg>
        </button>
        <button id="btn-maximize" class="win-btn win-btn-maximize" title="Maximize">
          <svg id="icon-max" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor"/></svg>
          <svg id="icon-restore" class="hidden" viewBox="0 0 10 10">
            <rect x="1" y="3" width="6" height="6" fill="none" stroke="currentColor"/>
            <path d="M3 3V1h6v6H7" fill="none" stroke="currentColor"/>
          </svg>
        </button>
        <button id="btn-close" class="win-btn win-btn-close" title="Close">
          <svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Desktop Layout -->
    <div class="app-layout">
      <!-- Left Sidebar (Windows 11 Navigation Style) -->
      <aside class="sidebar">
        <div class="user-profile">
          <div class="avatar">
            <span>N</span>
          </div>
          <div class="user-meta">
            <span class="user-title">Workspace</span>
            <span class="user-status"><span class="status-dot"></span> Offline / Local</span>
          </div>
        </div>

        <nav class="nav-section">
          <div class="nav-label">VIEWS</div>
          <button class="nav-item active" data-filter="all">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </span>
            <span class="nav-text">All Tasks</span>
            <span class="badge" id="count-all">0</span>
          </button>
          <button class="nav-item" data-filter="today">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </span>
            <span class="nav-text">Today</span>
            <span class="badge" id="count-today">0</span>
          </button>
          <button class="nav-item" data-filter="starred">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </span>
            <span class="nav-text">Priority / Starred</span>
            <span class="badge" id="count-starred">0</span>
          </button>
          <button class="nav-item" data-filter="completed">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </span>
            <span class="nav-text">Completed</span>
            <span class="badge" id="count-completed">0</span>
          </button>
        </nav>

        <div class="sidebar-divider"></div>

        <div class="nav-section">
          <div class="nav-label-row">
            <span class="nav-label">CATEGORIES</span>
            <button id="btn-add-category" class="icon-tiny-btn" title="Add Category">+</button>
          </div>
          <div id="category-list" class="category-list">
            <!-- Dynamic Category List -->
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="storage-indicator">
            <div class="progress-bar-bg">
              <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%"></div>
            </div>
            <div class="progress-text">
              <span id="completion-rate">0% completed</span>
              <span id="pending-count">0 left</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Canvas / Workspace -->
      <main class="main-content">
        <!-- Top Toolbar & Search -->
        <div class="content-header">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Search tasks, notes or tags..." />
            <span class="search-shortcut">Ctrl+K</span>
          </div>

          <div class="header-actions">
            <!-- Priority Filter -->
            <select id="priority-filter" class="select-pill">
              <option value="all">All Priorities</option>
              <option value="high">🔴 High</option>
              <option value="medium">🟡 Medium</option>
              <option value="low">🟢 Low</option>
            </select>

            <!-- Sort By -->
            <select id="sort-filter" class="select-pill">
              <option value="created-desc">Newest First</option>
              <option value="created-asc">Oldest First</option>
              <option value="due-date">Due Date</option>
              <option value="priority">Priority</option>
            </select>

            <!-- Quick Add Shortcut Trigger -->
            <button id="btn-open-create-modal" class="primary-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>New Task</span>
            </button>
          </div>
        </div>

        <!-- Quick Inline Input Bar -->
        <div class="inline-creator-card">
          <div class="inline-input-wrapper">
            <span class="inline-dot"></span>
            <input type="text" id="quick-input" placeholder="Type a task and hit Enter (e.g. 'Review client feedback @Design !high')..." />
          </div>
          <div class="quick-meta-toggles">
            <button type="button" id="toggle-quick-priority" class="pill-btn" data-priority="normal" title="Toggle Priority">
              <span class="dot-priority normal"></span> Normal
            </button>
            <input type="date" id="quick-due-date" class="pill-date" />
            <select id="quick-category-select" class="pill-select">
              <!-- Dynamically Populated -->
            </select>
            <button type="button" id="btn-quick-add" class="quick-add-btn">Add</button>
          </div>
        </div>

        <!-- Task List Area -->
        <div class="task-container-wrapper">
          <div class="task-list-header">
            <div class="list-title-group">
              <h1 id="current-view-title" class="view-title">All Tasks</h1>
              <span id="task-filter-counter" class="view-counter">0 tasks</span>
            </div>
            <div class="view-options">
              <button id="btn-clear-completed" class="ghost-btn" title="Clear all completed tasks">
                Clear Completed
              </button>
            </div>
          </div>

          <!-- The List -->
          <div id="tasks-list" class="tasks-list">
            <!-- Dynamic Task Cards -->
          </div>

          <!-- Empty State -->
          <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon-glow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 11l3 3L22 4"></path>
                <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
              </svg>
            </div>
            <h3>All clear!</h3>
            <p>You have no pending tasks in this view. Enjoy your day or create a new task.</p>
          </div>
        </div>
      </main>

      <!-- Right Detail / Edit Panel (Slide Over) -->
      <aside id="task-detail-pane" class="task-detail-pane collapsed">
        <div class="detail-header">
          <span class="detail-label">Task Details</span>
          <button id="btn-close-detail" class="icon-btn" title="Close Panel">✕</button>
        </div>
        <div class="detail-body">
          <div class="detail-section">
            <input type="text" id="detail-title" class="detail-title-input" placeholder="Task name..." />
          </div>

          <div class="detail-section">
            <label class="field-label">Status & Priority</label>
            <div class="meta-row">
              <select id="detail-priority" class="form-select">
                <option value="low">🟢 Low Priority</option>
                <option value="medium">🟡 Medium Priority</option>
                <option value="high">🔴 High Priority</option>
              </select>
              <select id="detail-category" class="form-select">
                <!-- Populated dynamically -->
              </select>
            </div>
          </div>

          <div class="detail-section">
            <label class="field-label">Due Date</label>
            <input type="date" id="detail-due-date" class="form-input" />
          </div>

          <div class="detail-section">
            <label class="field-label">Notes & Details</label>
            <textarea id="detail-notes" class="form-textarea" placeholder="Add additional context, links, or notes..." rows="6"></textarea>
          </div>

          <!-- Subtasks / Checklist -->
          <div class="detail-section">
            <div class="subtask-header">
              <label class="field-label">Subtasks</label>
              <span id="subtask-progress" class="subtask-progress">0/0</span>
            </div>
            <div id="subtask-list" class="subtask-list">
              <!-- Dynamically added -->
            </div>
            <div class="add-subtask-row">
              <input type="text" id="new-subtask-input" placeholder="Add a step..." />
              <button id="btn-add-subtask" class="btn-subtask-add">+</button>
            </div>
          </div>

          <div class="detail-footer">
            <button id="btn-delete-task" class="danger-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              Delete Task
            </button>
            <span id="detail-created-at" class="timestamp-label">Created just now</span>
          </div>
        </div>
      </aside>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Create New Category</h3>
          <button id="btn-close-cat-modal" class="icon-btn">✕</button>
        </div>
        <div class="modal-body">
          <label class="field-label">Category Name</label>
          <input type="text" id="new-cat-name" class="form-input" placeholder="e.g. Personal, Work, Project X" />

          <label class="field-label" style="margin-top: 14px;">Color Accent</label>
          <div class="color-picker-palette">
            <button type="button" class="color-swatch active" data-color="#38bdf8" style="background: #38bdf8;"></button>
            <button type="button" class="color-swatch" data-color="#a855f7" style="background: #a855f7;"></button>
            <button type="button" class="color-swatch" data-color="#10b981" style="background: #10b981;"></button>
            <button type="button" class="color-swatch" data-color="#f59e0b" style="background: #f59e0b;"></button>
            <button type="button" class="color-swatch" data-color="#ef4444" style="background: #ef4444;"></button>
            <button type="button" class="color-swatch" data-color="#ec4899" style="background: #ec4899;"></button>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-cancel-cat" class="ghost-btn">Cancel</button>
          <button id="btn-save-cat" class="primary-btn">Save Category</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
